[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalguard-qe"
version = "0.1.1"
description = "CI/CD Quality Gate & Automated Red-Teaming for GenAI & LLM Applications"
readme = "README.md"
authors = [{ name = "Krishna KV", email = "qe-community@evalguard.io" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
keywords = ["quality-engineering", "llm-evals", "red-teaming", "ci-cd", "genai-testing", "sdet", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/krishnakv-25/evalguard"
Repository = "https://github.com/krishnakv-25/evalguard"
Issues = "https://github.com/krishnakv-25/evalguard/issues"

[project.scripts]
evalguard = "evalguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evalguard*"]
