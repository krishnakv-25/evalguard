[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evalguard"
version = "0.1.0"
description = "CI/CD Quality Gate & Automated Red-Teaming for GenAI & LLM Applications"
readme = "README.md"
authors = [{ name = "Quality Engineering Community", email = "qe-community@evalguard.io" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
keywords = ["quality-engineering", "llm-evals", "red-teaming", "ci-cd", "genai-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
]

[project.scripts]
evalguard = "evalguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
